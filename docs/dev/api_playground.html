<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팜가디언 API 플레이그라운드</title>
<style>
:root {
  --bg: #f6f7f4; --panel: #ffffff; --text: #1d2a1f; --muted: #647067; --line: #dfe4dc;
  --accent: #2f7d4f; --accent-text: #ffffff; --danger: #b3382c; --warn: #9a6a00;
  --ok-bg: #e4f3e8; --err-bg: #fbe7e4; --warn-bg: #fff3d6; --info-bg: #e8eef5;
  --v-ok: #2f7d4f; --v-caution: #b7791f; --v-blocked: #b3382c; --v-check: #5a6b85;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181a; --panel: #1c2225; --text: #e4ebe5; --muted: #98a59c; --line: #2c363a;
    --accent: #5bb77f; --accent-text: #0e1a12; --danger: #ef7d70; --warn: #e3b04b;
    --ok-bg: #1d3326; --err-bg: #3a2220; --warn-bg: #3a3017; --info-bg: #212b38;
    --v-ok: #5bb77f; --v-caution: #e3b04b; --v-blocked: #ef7d70; --v-check: #8fa3c4;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; padding-bottom: 260px; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 15px; margin: 0; }
header .grow { flex: 1; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
nav#rail, aside#coverage, main#panel > .intro { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
nav#rail button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px; color: var(--text); cursor: pointer; font: inherit; }
nav#rail button small { display: block; color: var(--muted); }
nav#rail button.active { background: var(--ok-bg); font-weight: 600; }
main#panel h2 { font-size: 17px; margin: 0 0 4px; }
.intro p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; }
.card > h3 { font-size: 14px; margin: 0 0 2px; }
.card .apis { font: 12px var(--mono); color: var(--muted); margin: 0 0 8px; word-break: break-all; }
.card .body > * + * { margin-top: 8px; }
.note { border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.note.info { background: var(--info-bg); } .note.ok { background: var(--ok-bg); }
.note.warn { background: var(--warn-bg); } .note.err { background: var(--err-bg); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--info-bg); }
.badge.v-OK { background: var(--v-ok); color: #fff; } .badge.v-CAUTION { background: var(--v-caution); color: #fff; }
.badge.v-BLOCKED { background: var(--v-blocked); color: #fff; } .badge.v-NEEDS_CHECK { background: var(--v-check); color: #fff; }
.badge.good { background: var(--ok-bg); } .badge.bad { background: var(--err-bg); }
button, input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
input, select { min-width: 0; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); border-color: var(--danger); }
button.armed { background: var(--danger); color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { display: flex; gap: 4px; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td, th { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: left; vertical-align: top; }
td.mono, .mono { font-family: var(--mono); }
aside#coverage td:first-child { white-space: nowrap; }
svg.geo { width: 100%; max-width: 420px; height: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
svg.geo path { stroke-linejoin: round; }
svg.geo text { font: 11px system-ui, sans-serif; fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
#log { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 2px solid var(--line); max-height: 250px; display: flex; flex-direction: column; }
#log.collapsed { max-height: 34px; }
#log .bar { display: flex; gap: 8px; align-items: center; padding: 4px 12px; border-bottom: 1px solid var(--line); }
#log .items { overflow: auto; padding: 4px 12px; }
details.entry { border-bottom: 1px solid var(--line); font-size: 12px; }
details.entry summary { cursor: pointer; padding: 3px 0; font-family: var(--mono); }
details.entry.bad summary { color: var(--danger); }
details.entry pre { margin: 2px 0 6px; padding: 6px; background: var(--bg); border-radius: 4px; overflow: auto; max-height: 160px; white-space: pre-wrap; word-break: break-all; }
#notice { display: none; margin: 0; padding: 8px 16px; background: var(--warn-bg); border-bottom: 1px solid var(--line); }
#notice.on { display: flex; gap: 12px; align-items: center; }
.cov-sum { font-weight: 600; margin-bottom: 6px; }
.st-ok { color: var(--v-ok); } .st-bad { color: var(--danger); } .st-na { color: var(--muted); } .st-miss { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>팜가디언 API 플레이그라운드</h1>
  <label class="row">API 주소 <input id="base" size="26" spellcheck="false"></label>
  <button id="baseApply" type="button">적용</button>
  <span id="health" class="badge">확인 중</span>
  <span class="grow"></span>
  <span id="who"></span>
  <button id="logout" type="button">로그아웃</button>
</header>
<p id="notice"><span id="noticeText"></span><button id="noticeGo" type="button">로그인 화면으로</button></p>
<div class="layout">
  <nav id="rail"></nav>
  <main id="panel"></main>
  <aside id="coverage"></aside>
</div>
<section id="log">
  <div class="bar"><strong id="logTitle">요청 로그 (0)</strong><button id="logClear" type="button">지우기</button><button id="logToggle" type="button">접기</button></div>
  <div class="items" id="logItems"></div>
</section>

<script>
"use strict";
// ============================================================ 기본 도구
// API가 준 문자열은 항상 textContent로만 넣는다 (병해충 설명은 외부 데이터, 이름은 사용자 입력).
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const $ = (id) => document.getElementById(id);
const SVG_NS = "http://www.w3.org/2000/svg";

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* 저장 실패는 무시 */ } },
};
// localStorage에는 API 주소, 사용자 id, 아이디만 둔다. 비밀번호는 저장하지 않는다.
const state = {
  base: store.get("fg_base") || "http://localhost:8000",
  userId: store.get("fg_user") ? Number(store.get("fg_user")) : null,
  username: store.get("fg_username") || null,
  zone: null, // 고른 구역 {id, name, cropId, cropName}
  sectionId: "A",
};
function persist() { store.set("fg_base", state.base); store.set("fg_user", state.userId); store.set("fg_username", state.username); }

function note(box, kind, text) {
  const n = h("div", { class: `note ${kind}` }, text);
  box.append(n);
  return n;
}

// 파괴적 동작은 확인 창 대신 같은 버튼을 한 번 더 누르게 한다.
function twoStep(button, label, onConfirm) {
  let timer = null;
  const reset = () => { timer = null; button.textContent = label; button.classList.remove("armed"); };
  button.textContent = label;
  button.addEventListener("click", () => {
    if (timer) { clearTimeout(timer); reset(); onConfirm(button); return; }
    button.textContent = `한 번 더 누르면 ${label}`;
    button.classList.add("armed");
    timer = setTimeout(reset, 4000);
  });
  return button;
}

// 입력값은 form에 보관한다. 섹션을 다시 그려도(서버 확인이 끝났을 때 등) 입력이 사라지지 않게 한다.
const form = {};
function input(key, attrs = {}) {
  const el = h("input", attrs);
  el.value = form[key] ?? attrs.value ?? "";
  el.addEventListener("input", () => { form[key] = el.value; });
  return el;
}
function labeled(text, el) { return h("label", {}, text, el); }
// 요청이 끝날 때까지 버튼을 잠근다 (더블클릭 방지).
async function withLock(btn, fn) {
  if (btn.disabled) return undefined;
  btn.disabled = true;
  try { return await fn(); } finally { btn.disabled = false; }
}
function loginAs(id, username) {
  state.userId = id; state.username = username; persist(); renderWho(); $("notice").classList.remove("on");
  invalidateCaches();
}

const VERDICT = { OK: "가능", CAUTION: "주의", BLOCKED: "불가", NEEDS_CHECK: "확인 필요" };
function vBadge(verdict) {
  return h("span", { class: `badge v-${verdict}` }, VERDICT[verdict] || verdict);
}

// GeoJSON MultiPolygon(미터 좌표, y가 위쪽)을 SVG로 그린다. 레이어 전체에 bbox 하나를 쓰고 y를 뒤집는다 (명세 §1).
function drawGeometry(svg, layers, { width = 360, height = 240, pad = 8 } = {}) {
  svg.replaceChildren();
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("class", "geo");
  const pts = layers.flatMap((l) => l.geometry.coordinates.flat(2));
  if (!pts.length) return svg;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const w = Math.max(maxx - minx, 1e-6), hh = Math.max(maxy - miny, 1e-6);
  const s = Math.min((width - 2 * pad) / w, (height - 2 * pad) / hh);
  const ox = pad + ((width - 2 * pad) - w * s) / 2, oy = pad + ((height - 2 * pad) - hh * s) / 2;
  const X = (x) => (ox + (x - minx) * s).toFixed(1);
  const Y = (y) => (height - (oy + (y - miny) * s)).toFixed(1);
  for (const layer of layers) {
    const d = layer.geometry.coordinates
      .map((polygon) => polygon.map((ring) => "M" + ring.map((p) => `${X(p[0])},${Y(p[1])}`).join("L") + "Z").join(""))
      .join("");
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill-rule", "evenodd");
    path.style.fill = layer.fill || "none";
    path.style.fillOpacity = layer.opacity ?? "0.45";
    path.style.stroke = layer.stroke || "var(--text)";
    path.style.strokeWidth = layer.strokeWidth || "1.2";
    svg.append(path);
    if (layer.label) {
      const lp = layer.geometry.coordinates.flat(2);
      const cx = lp.reduce((a, p) => a + p[0], 0) / lp.length, cy = lp.reduce((a, p) => a + p[1], 0) / lp.length;
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", X(cx)); t.setAttribute("y", Y(cy)); t.setAttribute("text-anchor", "middle");
      t.textContent = layer.label;
      svg.append(t);
    }
  }
  return svg;
}
function geoSvg(layers, opts) { return drawGeometry(document.createElementNS(SVG_NS, "svg"), layers, opts); }

// ============================================================ 명세 24개 (시나리오의 「사용한 API 체크」 표)
const SPEC_APIS = [
  ["POST", "/auth/signup", [3]], ["POST", "/auth/login", [26]], ["GET", "/me", [4]],
  ["POST", "/me/onboarding", [11]], ["DELETE", "/me", [25]],
  ["GET", "/crops", [5]], ["GET", "/addresses/search", [1, 23]], ["GET", "/parcels", [2, 23]],
  ["POST", "/fields", [23]], ["GET", "/fields", [12]], ["DELETE", "/fields/{id}", [24]],
  ["POST", "/fields/{id}/split-preview", [6]], ["POST", "/fields/{id}/zones", [7]],
  ["GET", "/zones/{id}", [13]], ["PATCH", "/zones/{id}", [10, 22]], ["GET", "/zones/{id}/weather", [19]],
  ["GET", "/crops/{id}/symptom-parts", [14]], ["GET", "/pests/candidates", [15]], ["GET", "/pests", [16]],
  ["GET", "/pesticides", [17]], ["POST", "/zones/{id}/judgments", [18]],
  ["POST", "/zones/{id}/sprays", [8, 20]], ["GET", "/zones/{id}/sprays", [9, 21]], ["DELETE", "/zones/{id}/sprays/{sid}", [9]],
];
const normSpec = (p) => p.replace(/\{[^}]+\}/g, "{}");
const normCall = (p) => p.replace(/\/\d+(?=\/|$)/g, "/{}");
const apiKey = (m, p) => `${m} ${normSpec(p)}`;

// 서버의 /openapi.json으로 구현 여부를 안다. 못 읽으면(서버 꺼짐) 모두 구현된 것으로 보고 경고만 따로 띄운다.
const probe = { ok: false, set: new Set() };
function implemented(method, path) {
  return !probe.ok || probe.set.has(apiKey(method, path));
}
async function loadOpenapi() {
  probe.ok = false; probe.set = new Set();
  try {
    const res = await fetch(state.base.replace(/\/+$/, "") + "/openapi.json");
    const spec = await res.json();
    for (const [path, item] of Object.entries(spec.paths || {})) {
      for (const m of Object.keys(item)) probe.set.add(`${m.toUpperCase()} ${normSpec(path)}`);
    }
    probe.ok = probe.set.size > 0;
  } catch { probe.ok = false; }
  renderCoverage();
  showSection(state.sectionId);
}

// ============================================================ 커버리지 패널
const coverage = new Map(); // key -> {ok, status}
function markApi(method, path, result) {
  const key = apiKey(method, normCall(path));
  const prev = coverage.get(key);
  if (prev && prev.ok && !result.ok) return; // 한 번 성공했으면 성공으로 둔다
  coverage.set(key, { ok: result.ok, status: result.status });
  renderCoverage();
}
function renderCoverage() {
  const box = $("coverage");
  const missing = SPEC_APIS.filter(([m, p]) => probe.ok && !implemented(m, p)).length;
  const done = SPEC_APIS.filter(([m, p]) => coverage.get(apiKey(m, p))?.ok).length;
  box.replaceChildren(
    h("div", { class: "cov-sum" }, `${done}/24 호출 성공 · ${missing} 미구현`),
    h("p", { class: "mono", style: { margin: "0 0 6px", color: "var(--muted)" } }, probe.ok ? "서버 openapi.json 기준" : "서버 연결 안 됨"),
    h("table", {}, SPEC_APIS.map(([m, p, steps]) => {
      const c = coverage.get(apiKey(m, p));
      let icon = "–", cls = "st-na", tip = "아직 안 불렀음";
      if (probe.ok && !implemented(m, p)) { icon = "미구현"; cls = "st-miss"; tip = "서버에 없음"; }
      else if (c && c.ok) { icon = "✔"; cls = "st-ok"; tip = `성공 (${c.status})`; }
      else if (c) { icon = `✖ ${c.status}`; cls = "st-bad"; tip = `마지막 호출 실패 (${c.status})`; }
      return h("tr", { title: tip }, h("td", { class: cls }, icon), h("td", { class: "mono" }, m), h("td", { class: "mono" }, p), h("td", {}, steps.join(",")));
    })),
  );
}

// ============================================================ 요청 로그
let logCount = 0;
function redact(body) { return JSON.stringify(body, (k, v) => (k === "password" ? "••••" : v), 2); }
function clip(text) { return text.length > 20000 ? text.slice(0, 20000) + "\n… (잘림)" : text; }
function addLog({ method, url, body, status, ms, data, error }) {
  logCount += 1;
  $("logTitle").textContent = `요청 로그 (${logCount})`;
  const bad = !!error;
  const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  const shown = url.pathname + url.search;
  const entry = h("details", { class: `entry${bad ? " bad" : ""}` },
    h("summary", {}, `${time} ${method} ${shown} → ${status || "연결 실패"} ${ms}ms${error ? " " + error.code : ""}`),
    body !== undefined ? h("pre", {}, "요청 본문\n" + redact(body)) : null,
    h("pre", {}, "응답\n" + clip(error && status === 0 ? error.message : data == null ? "(본문 없음)" : JSON.stringify(data, null, 2))),
  );
  $("logItems").prepend(entry);
}
$("logClear").addEventListener("click", () => { $("logItems").replaceChildren(); logCount = 0; $("logTitle").textContent = "요청 로그 (0)"; });
$("logToggle").addEventListener("click", () => {
  const c = $("log").classList.toggle("collapsed");
  $("logToggle").textContent = c ? "펴기" : "접기";
});

// ============================================================ API 호출
// 절대 throw하지 않는다. 연결 실패는 status 0, error.code NETWORK로 돌려준다.
async function api(method, path, { query, body, auth = true, quiet = false } = {}) {
  let url;
  try {
    url = new URL(state.base.replace(/\/+$/, "") + path);
  } catch {
    return { ok: false, status: 0, ms: 0, data: null, error: { code: "NETWORK", message: `API 주소가 올바르지 않습니다: ${state.base}` } };
  }
  for (const [k, v] of Object.entries(query || {})) if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (auth && state.userId) headers["X-User-Id"] = String(state.userId);
  const t0 = performance.now();
  let status = 0, text = "", data = null, error = null;
  try {
    const res = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    status = res.status;
    text = await res.text();
  } catch {
    error = { code: "NETWORK", message: `서버에 연결할 수 없습니다 (${state.base}).\nAPI 서버가 켜져 있는지, 이 페이지를 서버 CORS가 허용한 주소(예: http://localhost:3000)에서 열었는지 확인하세요.` };
  }
  if (!error) {
    if (text) {
      try { data = JSON.parse(text); } catch { error = { code: "NON_JSON", message: text.slice(0, 200) }; }
    }
    if (!error && status >= 400) error = (data && data.error) || { code: `HTTP_${status}`, message: text.slice(0, 200) };
  }
  const result = { ok: !error && status >= 200 && status < 300, status, ms: Math.round(performance.now() - t0), data, error };
  if (!quiet) {
    addLog({ method, url, body, status, ms: result.ms, data, error });
    markApi(method, path, result);
  }
  if (status === 401 && auth && state.userId) {
    state.userId = null; state.username = null; persist(); renderWho(); invalidateCaches();
    showNotice("저장된 사용자 id가 더 이상 유효하지 않습니다(탈퇴했거나 없는 사용자). 다시 로그인하세요.");
  }
  return result;
}

// 오류를 사람이 읽을 문장으로. 422는 항목별 loc와 msg를 풀어 쓴다.
function errorText(r) {
  const e = r.error;
  if (!e) return "";
  const items = e.details && e.details.errors;
  const lines = items ? items.map((i) => `· ${(i.loc || []).slice(1).join(".") || "-"}: ${i.msg}`).join("\n") : "";
  return `${e.code}${e.message ? ` — ${e.message}` : ""}${lines ? "\n" + lines : ""}`;
}

// ============================================================ 머리말·알림
function renderWho() {
  $("who").textContent = state.userId ? `로그인: ${state.username || "?"} (id ${state.userId})` : "로그인 안 됨";
  $("logout").disabled = !state.userId;
}
function showNotice(text) { $("noticeText").textContent = text; $("notice").classList.add("on"); }
$("noticeGo").addEventListener("click", () => { $("notice").classList.remove("on"); showSection("A"); });
$("logout").addEventListener("click", () => { state.userId = null; state.username = null; persist(); renderWho(); invalidateCaches(); showSection(state.sectionId); });
async function checkHealth() {
  const r = await api("GET", "/health", { auth: false, quiet: true });
  const ok = r.ok && r.data && r.data.status === "ok";
  const b = $("health");
  b.textContent = ok ? "연결됨" : "연결 안 됨";

}

function card(no, title, apis) {
  const missing = apis.filter((a) => { const [m, p] = a.split(" "); return !implemented(m, p); });
  const body = h("div", { class: "body" });
  const el = h("section", { class: "card", id: `step-${no}` },
    h("h3", {}, `${no}. ${title}`),
    h("p", { class: "apis" }, "부르는 API: " + apis.join(" · ")),
  );
  if (missing.length) note(el, "warn", `아직 구현 안 됨 (서버 openapi.json에 없음): ${missing.join(", ")}\n구현되면 이 카드는 수정 없이 동작합니다.`);
  el.append(body);
  return { el, body, missing };
}

function showSection(id) {
  state.sectionId = id;
  for (const k of Object.keys(PICK)) PICK[k].views = {};
  zoneWidgets.length = 0;
  const sec = SECTIONS.find((s) => s.id === id) || SECTIONS[0];
  $("rail").replaceChildren(...SECTIONS.map((s) => h("button", { class: s.id === sec.id ? "active" : "", type: "button", onclick: () => showSection(s.id) },
    s.title, h("small", {}, `단계 ${s.range}`))));
  const panel = $("panel");
  panel.replaceChildren(h("div", { class: "intro" }, h("h2", {}, sec.title), h("p", {}, sec.intro)));
  for (const [no, title, apis] of sec.steps) {
    const c = card(no, title, apis);
    const fn = STEP_RENDER[no];
    if (fn) fn(c.body, c); else note(c.body, "info", "이 단계는 아직 화면이 없습니다 (다음 작업에서 추가됩니다).");
    panel.append(c.el);
  }
}

// ============================================================ 필지 고르기 (A의 1–2단계, F의 23단계)
// 검색 결과·필지 목록·선택 상태는 PICK[key]에 두고, 화면 조각(search/parcels/count)만 다시 그린다.
const PICK = {};
function pickState(key) {
  return (PICK[key] ||= { keyword: "", page: 1, total: null, items: [], msg: null, pnu: null, parcels: null, parcelMsg: null, selected: new Set(), views: {} });
}
function pickView(key, role, box) { pickState(key).views[role] = box; pickRedraw(key, role); }
function pickRedraw(key, ...roles) {
  const st = pickState(key);
  const draw = { search: drawSearch, parcels: drawParcels, count: drawCount };
  for (const r of roles) if (st.views[r]) draw[r](key, st, st.views[r]);
}
function drawCount(key, st, box) { box.className = "badge"; box.textContent = `${st.selected.size}개`; }
function drawSearch(key, st, box) {
  box.replaceChildren();
  const kw = h("input", { size: 28, placeholder: "예: 청평리 161-3", spellcheck: "false" });
  kw.value = st.keyword;
  kw.addEventListener("input", () => { st.keyword = kw.value; });
  const go = h("button", { class: "primary", type: "button" }, "검색");
  const run = (page) => withLock(go, async () => {
    const r = await api("GET", "/addresses/search", { query: { keyword: st.keyword, page }, auth: false });
    st.page = page;
    if (r.ok) { st.total = r.data.total; st.items = r.data.items; st.msg = null; }
    else { st.total = null; st.items = []; st.msg = errorText(r); }
    pickRedraw(key, "search");
  });
  go.addEventListener("click", () => run(1));
  kw.addEventListener("keydown", (e) => { if (e.key === "Enter") run(1); });
  box.append(h("div", { class: "row" }, kw, go));
  if (st.msg) note(box, "err", st.msg);
  if (st.total === 0) note(box, "info", "검색 결과가 없습니다 ({total: 0, items: []}).");
  if (st.items.length) {
    box.append(h("table", {}, st.items.map((it) => h("tr", {},
      h("td", {}, it.jibun_addr), h("td", { class: "mono" }, it.pnu),
      h("td", {}, h("button", { type: "button", onclick: (e) => loadParcels(key, st, it.pnu, e.currentTarget) }, "필지 불러오기"))))));
    const pages = Math.ceil(st.total / 10);
    box.append(h("div", { class: "row" }, `총 ${st.total}건 · ${st.page}/${pages} 페이지`,
      h("button", { type: "button", disabled: st.page <= 1, onclick: () => run(st.page - 1) }, "이전"),
      h("button", { type: "button", disabled: st.page >= pages, onclick: () => run(st.page + 1) }, "다음")));
  }
}
async function loadParcels(key, st, pnu, btn) {
  await withLock(btn, async () => {
    const r = await api("GET", "/parcels", { query: { pnu } }); // 로그인했으면 X-User-Id가 붙어 「사용 중」이 표시된다
    st.pnu = pnu;
    if (r.ok) {
      st.parcels = r.data; st.parcelMsg = null;
      st.selected = new Set(r.data.filter((p) => p.matches_query && p.used_by_field_id == null).map((p) => p.farmmap_id));
    } else { st.parcels = null; st.parcelMsg = errorText(r); st.selected = new Set(); }
    pickRedraw(key, "parcels", "count");
  });
}
function drawParcels(key, st, box) {
  box.replaceChildren();
  if (st.parcelMsg) note(box, "err", st.parcelMsg);
  if (!st.parcels) { if (!st.parcelMsg) note(box, "info", "먼저 검색 결과에서 「필지 불러오기」를 누르세요."); return; }
  if (!st.parcels.length) { note(box, "info", "이 지번과 겹치는 팜맵 필지가 없습니다 (빈 배열)."); return; }
  box.append(geoSvg(st.parcels.map((p) => ({
    geometry: p.geometry, label: p.lnm,
    fill: p.used_by_field_id != null ? "var(--warn)" : st.selected.has(p.farmmap_id) ? "var(--accent)" : "var(--muted)",
  }))));
  note(box, "info", "이웃 지번의 필지도 함께 나옵니다. 내 필지를 골라 주세요. 「사용 중」은 이 사용자의 다른 밭이 쓰는 필지입니다.");
  for (const p of st.parcels) {
    const cb = h("input", { type: "checkbox", disabled: p.used_by_field_id != null });
    cb.checked = st.selected.has(p.farmmap_id);
    cb.addEventListener("change", () => {
      if (cb.checked) st.selected.add(p.farmmap_id); else st.selected.delete(p.farmmap_id);
      pickRedraw(key, "parcels", "count");
    });
    box.append(h("label", { class: "row" }, cb, h("span", { class: "mono" }, p.farmmap_id),
      `${p.lnm} · ${p.land_use} · ${p.area_m2}㎡ · ${p.vdpt_yr ?? "-"}`,
      p.matches_query ? h("span", { class: "badge good" }, "조회한 지번") : null,
      p.used_by_field_id != null ? h("span", { class: "badge bad" }, `사용 중 (밭 #${p.used_by_field_id})`) : null));
  }
}

// ============================================================ 밭 보여주기 (Field: 도형과 구역 요약)
const ZONE_COLORS = ["#2f7d4f", "#b7791f", "#3b6ea5", "#a0457a", "#6b8e23", "#c0562a"];
function judgmentCell(j) {
  return j ? [vBadge(j.verdict), ` ${j.pesticide.name}${j.pest ? " / " + j.pest.name : ""}`] : "기록 없음";
}
function renderField(box, field) {
  const layers = [{ geometry: field.geometry, fill: "none", strokeWidth: "1.8" }];
  (field.zones || []).forEach((z, i) => layers.push({ geometry: z.geometry, fill: ZONE_COLORS[i % ZONE_COLORS.length], label: z.name }));
  const wrap = h("div", {},
    h("div", {}, h("strong", {}, field.name), ` · 밭 #${field.id} · ${field.area_m2}㎡ · bbox [${field.bbox.join(", ")}]`),
    geoSvg(layers));
  if ((field.zones || []).length) {
    wrap.append(h("table", {},
      h("tr", {}, ["구역", "작물", "정식일", "누락 없음", "마지막 살포", "최근 판정"].map((t) => h("th", {}, t))),
      field.zones.map((z) => h("tr", {},
        h("td", {}, `#${z.id} ${z.name}`), h("td", {}, z.crop.name), h("td", {}, z.planted_at || "-"),
        h("td", {}, z.history_confirmed ? "✔" : "–"),
        h("td", {}, z.last_spray ? `${z.last_spray.sprayed_on} ${z.last_spray.pesticide.name}` : "기록 없음"),
        h("td", {}, judgmentCell(z.last_judgment))))));
  } else {
    note(wrap, "info", "아직 나누지 않은 밭입니다 (zones가 비어 있음).");
  }
  box.append(wrap);
  return wrap;
}

const zoneWidgets = [];
let FIELDS_P = null; // GET /fields 결과(밭 + 구역 요약)의 프라미스. 여러 위젯이 한 번의 호출을 같이 쓴다

const CROP_FALLBACK = [{ id: 1, name: "감자" }, { id: 2, name: "배추" }, { id: 3, name: "토마토" }]; // 명세 §4
function invalidateFields() { FIELDS_P = null; }
function invalidateCaches() { FIELDS_P = null; state.zone = null; zoneWidgets.length = 0; }
function loadFields(force) {
  if (!force && FIELDS_P) return FIELDS_P;
  FIELDS_P = api("GET", "/fields").then((r) => (r.ok ? r.data : null));
  return FIELDS_P;
}
async function loadCrops() {
  if (CROPS) return CROPS;
  const r = await api("GET", "/crops");
  if (r.ok) CROPS = r.data;
  return CROPS;
}
const todayStr = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" }); // YYYY-MM-DD (KST)
const zonesOf = (fields) => fields.flatMap((f) => f.zones.map((z) => ({
  id: z.id, name: z.name, cropId: z.crop.id, cropName: z.crop.name, fieldId: f.id, fieldName: f.name,
  plantedAt: z.planted_at, confirmed: z.history_confirmed,
})));

function fieldSelect(key) {
  const sel = h("select");
  sel.addEventListener("change", () => { form[key] = sel.value; });
  loadFields().then((fs) => {
    sel.replaceChildren(...(fs && fs.length
      ? fs.map((f) => h("option", { value: String(f.id) }, `#${f.id} ${f.name}`))
      : [h("option", { value: "" }, fs ? "밭이 없습니다" : "밭 목록 없음 (로그인했나요?)")]));
    if (form[key] && [...sel.options].some((o) => o.value === form[key])) sel.value = form[key];
    else if (fs && fs.length) { sel.value = String(fs[0].id); form[key] = sel.value; }
  });

}
function cropSelect(key, def) {

}

// 구역 고르기: GET /fields의 구역 목록, 또는 구역 id를 직접 입력 (구역 생성 API가 없는 동안의 대체 경로).
function setZone(z) { state.zone = z; for (const w of zoneWidgets) w.sync(); }
function pickZone(box, onPick) {
  const sel = h("select");
  const info = h("div", { class: "mono" });
  const manualId = h("input", { type: "number", min: "1", size: 8, placeholder: "구역 id" });
  const manualCrop = cropSelect("zm_crop", "1");
  let zones = [];
  const w = {
    sync() {
      const z = state.zone;
      if (z && zones.some((x) => x.id === z.id)) sel.value = String(z.id); else sel.value = "";
      info.textContent = z ? `선택한 구역: #${z.id} ${z.name || ""} (작물 ${z.cropName || z.cropId})` : "선택한 구역: 없음";
      onPick(z);
    },
    async refresh(force) {
      const fs = await loadFields(force);
      zones = fs ? zonesOf(fs) : [];
      sel.replaceChildren(h("option", { value: "" }, fs ? (zones.length ? "구역을 고르세요" : "구역이 없습니다") : "밭 목록을 못 불러왔습니다 (로그인했나요?)"),
        ...zones.map((z) => h("option", { value: String(z.id) }, `${z.fieldName} / #${z.id} ${z.name} (${z.cropName})`)));
      // 한 위젯에서 새로고침하면 같은 카드 묶음의 다른 위젯도 새 목록을 쓴다
      if (force) for (const x of zoneWidgets) if (x !== w && x.refresh) x.refresh(false);
      if (!state.zone && zones.length === 1) setZone(zones[0]); // 모든 위젯에 선택을 알린다
      else w.sync();
    },
  };
  zoneWidgets.push(w);
  sel.addEventListener("change", () => { const z = zones.find((x) => String(x.id) === sel.value); if (z) setZone(z); });
  box.append(
    h("div", { class: "row" }, labeled("구역 ", sel), h("button", { type: "button", onclick: () => w.refresh(true) }, "새로고침")),
    h("div", { class: "row" }, "직접 입력: ", manualId, manualCrop, h("button", { type: "button", onclick: () => {
      const id = Number(manualId.value);
      if (Number.isInteger(id) && id > 0) setZone({ id, name: "", cropId: Number(manualCrop.value), cropName: "" });
    } }, "사용")),
    info);
  w.refresh(false);
  return w;
}

// ============================================================ 공용: SQL 대체 블록 (구현이 없는 API용)
const sqlQ = (v) => `'${String(v).replace(/'/g, "''")}'`;
const sqlInt = (v) => String(Math.trunc(Number(v)) || 0);
function sqlZone(fieldId, userId, cropId, name) {
  return `INSERT INTO zone (field_id, user_id, name, crop_id, geom)\nSELECT id, user_id, ${sqlQ(name || "구역")}, ${sqlInt(cropId)}, geom\nFROM field WHERE id = ${sqlInt(fieldId)} AND user_id = ${sqlInt(userId)}\nRETURNING id;`;
}
// 명세 §5 PATCH 규칙: 작물이 바뀌면 정식일은 요청 값(없으면 NULL)이 되고 「누락 없음」은 풀린다. 정식일이 바뀌어도 풀린다(같은 요청에서 명시하면 그 값).
function sqlZoneUpdate(zoneId, { name, cropId, plantedAt, confirmed }) {
  const set = [];
  if (name) set.push(`name = ${sqlQ(name)}`);
  if (cropId) set.push(`crop_id = ${sqlInt(cropId)}`);
  if (plantedAt !== undefined || cropId) set.push(`planted_at = ${plantedAt ? sqlQ(plantedAt) : "NULL"}`);
  if (confirmed !== undefined) set.push(`history_confirmed = ${confirmed ? "true" : "false"}`);
  else if (plantedAt !== undefined || cropId) set.push("history_confirmed = false");
  return set.length ? `UPDATE zone SET ${set.join(", ")} WHERE id = ${sqlInt(zoneId)};` : "-- 바꿀 값이 없습니다";
}
const sqlConfirm = (zoneId, plantedAt) => sqlZoneUpdate(zoneId, { plantedAt, confirmed: true });
function sqlBlock(box, title, getSql) {
  const pre = h("pre", { class: "mono", style: { margin: 0, padding: "8px", background: "var(--bg)", borderRadius: "6px", whiteSpace: "pre-wrap", wordBreak: "break-all" } });
  const copy = h("button", { type: "button" }, "복사");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(pre.textContent); copy.textContent = "복사됨"; }
    catch { copy.textContent = "직접 선택해 복사하세요"; }
    setTimeout(() => { copy.textContent = "복사"; }, 2000);
  });
  const wrap = h("div", {}, h("div", { class: "note warn" }, `${title}\n개발 DB(farmguardian)에서 실행하세요 (Windows는 PGCLIENTENCODING=UTF8을 먼저 설정).`), pre, copy);
  box.append(wrap);
  const update = () => { pre.textContent = getSql(); };
  update();
  return { update };
}

// ============================================================ 공용: 약제 고르기와 살포 기록 저장
const DRUGS = {}; // cropId -> [Pesticide + at_planting_only]
async function loadDrugs(cropId) {
  if (DRUGS[cropId]) return DRUGS[cropId];
  const r = await api("GET", "/pesticides", { query: { crop_id: cropId } });
  if (r.ok) DRUGS[cropId] = r.data;
  return DRUGS[cropId] || null;
}
function drugPicker(box, getCropId) {

// 「살포 기록 저장」: 저장 동작 한 번에 request_id 하나를 만들고 재시도에는 같은 값을 쓴다 (명세 §8).
// 성공(200/201)이나 「돌아가기」로 끝나면 비우고, 연결 실패·5xx면 남겨서 재시도가 같은 값을 쓰게 한다.
function spraySummary(s) { return `#${s.id} ${s.sprayed_on} ${s.pesticide.name} (${s.pesticide.item_name}) · ${s.source}`; }
function saveSprayUI(box, { getDrug, getDate, getZone, doubleDemo = false, onSaved }) {
  let pending = null;
  const out = h("div");
  const btn = h("button", { class: "primary", type: "button" }, "살포 기록 저장");
  const body = (allowDup) => {
    const drug = getDrug();
    const b = { pesticide_id: drug.id, source: "manual", request_id: pending.rid };
    if (getDate()) b.sprayed_on = getDate();
    if (allowDup) b.allow_duplicate = true;
    return b;
  };
  const ready = () => {
    out.replaceChildren();
    if (!getZone()) { note(out, "err", "구역을 먼저 고르세요."); return false; }
    if (!getDrug()) { note(out, "err", "약제를 먼저 고르세요."); return false; }
    return true;
  };
  async function send(allowDup) {
    pending ||= { rid: crypto.randomUUID() };
    const r = await api("POST", `/zones/${getZone().id}/sprays`, { body: body(allowDup) });
    out.replaceChildren();
    if (r.status === 201) { pending = null; note(out, "ok", `저장됨 (201): ${spraySummary(r.data)}`); if (onSaved) onSaved(r.data); }
    else if (r.status === 200) { pending = null; note(out, "info", `같은 request_id가 이미 저장돼 있어 그 기록을 그대로 돌려받았습니다 (200, 다시 저장하지 않음): ${spraySummary(r.data)}`); if (onSaved) onSaved(r.data); }
    else if (r.status === 409 && r.error.code === "DUPLICATE_SPRAY") {
      const ex = r.error.details && r.error.details.existing;
      const detail = h("div");
      note(out, "warn", `같은 구역·약제·날짜 기록이 이미 있습니다 (409 DUPLICATE_SPRAY).\n기존 기록: ${ex ? spraySummary(ex) : "(details.existing 없음)"}`);
      out.append(h("div", { class: "row" },
        h("button", { type: "button", onclick: () => { detail.replaceChildren(h("pre", {}, JSON.stringify(ex, null, 2))); } }, "기존 기록 확인"),
        h("button", { class: "primary", type: "button", onclick: (e) => withLock(e.currentTarget, async () => { await send(true); }) }, "별도 살포로 저장"),
        h("button", { type: "button", onclick: () => { pending = null; out.replaceChildren(); } }, "돌아가기")), detail);
    } else if (r.status === 0 || r.status >= 500) {
      note(out, "err", `${errorText(r)}\n저장 결과를 알 수 없습니다. 다시 누르면 같은 request_id(${pending.rid})로 재시도합니다.`);
    } else { pending = null; note(out, "err", errorText(r)); }
    return r;
  }
  btn.addEventListener("click", () => withLock(btn, async () => { if (ready()) await send(false); }));
  box.append(btn);
  if (doubleDemo) {
    const demo = h("button", { type: "button" }, "두 번 눌러 보기");
    demo.addEventListener("click", () => withLock(demo, async () => {
      if (!ready()) return;
      pending = { rid: crypto.randomUUID() };
      const post = () => api("POST", `/zones/${getZone().id}/sprays`, { body: body(false) });
      const r1 = await post();
      const r2 = await post();
      const same = r1.data && r2.data && r1.data.id === r2.data.id;
      pending = null; out.replaceChildren();
      note(out, r1.status === 201 && r2.status === 200 && same ? "ok" : "warn",
        `같은 request_id로 두 번 보냄: 1회차 ${r1.status}, 2회차 ${r2.status}${same ? ` — 같은 기록(#${r1.data.id}), 한 번만 저장됨` : ""}${r1.error ? "\n" + errorText(r1) : ""}`);
      if (r1.data && onSaved) onSaved(r1.data);
    }));
    box.append(demo);
  }
  box.append(out);
  return { reset() { pending = null; out.replaceChildren(); } };
}

// ============================================================ 공용: 살포 이력 목록 (9단계, 21단계)
function historyView(box, { limit: limit0 = 20 } = {}) {
  const out = h("div");
  let offset = 0, seq = 0; // seq: 동시에 여러 번 불러도 마지막 요청만 그린다
  const limSel = h("select", {}, [1, 5, 20, 100].map((n) => h("option", { value: String(n) }, `${n}건씩`)));
  limSel.value = String(limit0);
  async function load() {
    const z = state.zone, my = ++seq;
    out.replaceChildren();
    if (!z) { note(out, "info", "구역을 먼저 고르세요."); return; }
    const limit = Number(limSel.value);
    const r = await api("GET", `/zones/${z.id}/sprays`, { query: { limit, offset } });
    if (my !== seq) return;
    if (!r.ok) { note(out, "err", errorText(r)); return; }
    const { total, items } = r.data;
    if (!items.length) note(out, "info", total ? `이 페이지에는 기록이 없습니다 (전체 ${total}건, offset ${offset}).` : "살포 기록이 없습니다.");
    else {
      out.append(h("table", {}, h("tr", {}, ["날짜", "약제", "작용기작", "입력", "id", ""].map((t) => h("th", {}, t))),
        items.map((s) => h("tr", {}, h("td", {}, s.sprayed_on), h("td", {}, `${s.pesticide.name} (${s.pesticide.item_name})`),
          h("td", {}, s.pesticide.moa ? s.pesticide.moa.label_kr : "-"), h("td", {}, s.source), h("td", { class: "mono" }, s.id),
          h("td", {}, twoStep(h("button", { class: "danger", type: "button" }, "취소"), "취소", async () => {
            const d = await api("DELETE", `/zones/${z.id}/sprays/${s.id}`);
            if (d.status === 204) await load(); else { out.replaceChildren(); note(out, "err", errorText(d)); }
          }))))));
    }
    const first = total ? offset + 1 : 0, last = Math.min(offset + limit, total);
    out.append(h("div", { class: "row" }, `전체 ${total}건 · ${first}–${last}번`,
      h("button", { type: "button", disabled: offset <= 0, onclick: () => { offset = Math.max(0, offset - limit); load(); } }, "이전"),
      h("button", { type: "button", disabled: offset + limit >= total, onclick: () => { offset += limit; load(); } }, "다음")));
  }
  pickZone(box, () => { offset = 0; load(); });
  limSel.addEventListener("change", () => { offset = 0; load(); });
  box.append(h("div", { class: "row" }, h("button", { type: "button", onclick: load }, "이력 새로고침"), limSel), out);
  return { reload: load };
}

// ============================================================ 공용: 구역 수정 (10단계, 22단계)
function zoneEditForm(box, c, { name = false, crop = false, planted = true, confirmed = false } = {}) {
  const out = h("div");
  const nameIn = name ? h("input", { size: 14, placeholder: "새 이름" }) : null;
  const cropSel = crop ? cropSelect(`ze_crop_${c.no || "x"}`, "1") : null;
  const cropGo = crop ? h("input", { type: "checkbox" }) : null;
  const dateIn = planted ? h("input", { type: "date" }) : null;
  const nullBox = planted ? h("input", { type: "checkbox" }) : null;
  const confSel = confirmed ? h("select", {}, [["", "변경 안 함"], ["true", "누락 없음 확인 (true)"], ["false", "확인 풀기 (false)"]].map(([v, t]) => h("option", { value: v }, t))) : null;
  const patch = () => {
    const b = {};
    if (nameIn && nameIn.value.trim()) b.name = nameIn.value.trim();
    if (cropGo && cropGo.checked) b.crop_id = Number(cropSel.value);
    if (dateIn && nullBox.checked) b.planted_at = null; else if (dateIn && dateIn.value) b.planted_at = dateIn.value;
    if (confSel && confSel.value) b.history_confirmed = confSel.value === "true";
    return b;
  };
  const sqlOf = () => {
    const b = patch();
    return state.zone ? sqlZoneUpdate(state.zone.id, { name: b.name, cropId: b.crop_id, plantedAt: b.planted_at, confirmed: b.history_confirmed }) : "-- 구역을 먼저 고르세요";
  };
  pickZone(box, () => {});
  box.append(h("div", { class: "row" },
    nameIn ? labeled("이름 ", nameIn) : null,
    cropSel ? h("label", {}, cropGo, " 작물 변경 ", cropSel) : null,
    dateIn ? labeled("정식일 ", dateIn) : null, nullBox ? h("label", {}, nullBox, " 정식일 비우기") : null,
    confSel ? labeled("누락 없음 ", confSel) : null));
  const btn = h("button", { class: "primary", type: "button" }, "구역 수정");
  btn.disabled = c.missing.length > 0;
  btn.addEventListener("click", () => withLock(btn, async () => {
    out.replaceChildren();
    if (!state.zone) { note(out, "err", "구역을 먼저 고르세요."); return; }
    const r = await api("PATCH", `/zones/${state.zone.id}`, { body: patch() });
    if (!r.ok) { note(out, "err", errorText(r)); return; }
    invalidateFields();
    const z = r.data;
    note(out, "ok", `수정됨: #${z.id} ${z.name} · 작물 ${z.crop.name} · 정식일 ${z.planted_at || "없음"} · 누락 없음 ${z.history_confirmed}\n(정식일이 바뀌면 서버가 「누락 없음」을 풀어 둡니다. 같은 요청에서 명시하면 그 값.)`);
  }));
  box.append(btn, out);
  if (c.missing.length) {
    const sb = sqlBlock(box, "PATCH /zones/{id}가 없어서 같은 규칙의 SQL로 대신합니다.", sqlOf);
    for (const el of [nameIn, cropSel, cropGo, dateIn, nullBox, confSel]) if (el) { el.addEventListener("input", sb.update); el.addEventListener("change", sb.update); }
    zoneWidgets.push({ sync: sb.update });
  }
}

  drug = drugPicker(holder, () => state.zone && state.zone.cropId);
  box.append(holder, h("div", { class: "row" }, labeled("살포일 ", input("sp8_date", { type: "date", value: "" }))));
  saveSprayUI(box, { getDrug: () => drug.get(), getDate: () => form.sp8_date, getZone: () => state.zone });
  if (state.zone) drug.reload();
});

defineStep(9, (box) => historyView(box));
defineStep(10, (box, c) => {
  box.append(h("div", { class: "note info" }, "순서: 정식일 → 과거 이력 입력 → 마지막에 「누락 없음」 확인. 정식일을 바꾸면 확인이 풀립니다."));
  zoneEditForm(box, { ...c, no: 10 }, { planted: true, confirmed: true });
});
defineStep(11, (box) => {
  const out = h("div");
  const btn = h("button", { class: "primary", type: "button" }, "온보딩 완료");
  btn.addEventListener("click", () => withLock(btn, async () => {
    out.replaceChildren();
    const r = await api("POST", "/me/onboarding");
    if (r.ok) { note(out, "ok", `온보딩 완료 (onboarded: ${r.data.onboarded}). 이미 끝났어도 200입니다.`); return; }
    const d = r.error && r.error.details;
    if (r.error && r.error.code === "ONBOARDING_INCOMPLETE" && d) {
      note(out, "warn", `온보딩을 끝낼 수 없습니다 (422 ONBOARDING_INCOMPLETE): 구역 ${d.zone_count}개, 「누락 없음」이 안 된 구역 id ${d.unconfirmed_zone_ids.length ? d.unconfirmed_zone_ids.join(", ") : "없음"}\n구역이 없거나 한 구역이라도 확인이 안 됐으면 끝낼 수 없습니다.`);
    } else note(out, "err", errorText(r));
  }));
  box.append(btn, out);
});

// ============================================================ 시작
window.addEventListener("error", (e) => { addLog({ method: "JS", url: new URL(location.href), status: 0, ms: 0, data: null, error: { code: "PAGE_ERROR", message: String(e.message) } }); });
function init() {
  renderWho(); renderCoverage(); showSection("A");
  checkHealth(); loadOpenapi();
}
init();
</script>
